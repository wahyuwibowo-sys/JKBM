<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
  </defs>
  <!-- Outer Shield Border -->
  <path d="M 20,25 C 20,15 100,5 100,5 C 100,5 180,15 180,25 C 185,90 180,180 100,245 C 20,180 15,90 20,25 Z" fill="#FFFFFF" stroke="#212121" stroke-width="4"/>
  <path d="M 24,28 C 24,19 100,10 100,10 C 100,10 176,19 176,28 C 180,88 175,175 100,238 C 25,175 20,88 24,28 Z" fill="url(#skyGrad)" stroke="#1565C0" stroke-width="1.5"/>
  <!-- Mount Semeru / Mountain in Background -->
  <path d="M 50,180 L 100,95 L 150,180 Z" fill="#4E342E" stroke="#3E2723" stroke-width="2"/>
  <path d="M 85,120 L 100,95 L 115,120 Z" fill="#3E2723"/>
  <!-- Volcanic Smoke -->
  <path d="M 95,95 Q 85,60 100,38 Q 115,60 105,95 Z" fill="#ECEFF1" opacity="0.85"/>
  <!-- Candi / Temple structures flanking Tugu Pahlawan -->
  <path d="M 72,180 L 72,115 L 77,115 L 77,125 L 82,125 L 82,145 L 88,145 L 88,180 Z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <path d="M 128,180 L 128,115 L 123,115 L 123,125 L 118,125 L 118,145 L 112,145 L 112,180 Z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <!-- Tugu Pahlawan (Surabaya Obelisk) -->
  <path d="M 96,180 L 98,75 L 102,75 L 104,180 Z" fill="#FFFFFF" stroke="#455A64" stroke-width="1.5"/>
  <polygon points="100,60 98,75 102,75" fill="#FFE082" stroke="#FFA000" stroke-width="1"/>
  <!-- Gold Star at Top with Red/White Rays -->
  <!-- Rays -->
  <line x1="100" y1="30" x2="65" y2="40" stroke="#D32F2F" stroke-width="4"/>
  <line x1="100" y1="30" x2="65" y2="40" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="100" y1="30" x2="135" y2="40" stroke="#D32F2F" stroke-width="4"/>
  <line x1="100" y1="30" x2="135" y2="40" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="100,14 105,27 119,27 108,35 112,48 100,40 88,48 92,35 81,27 95,27" fill="url(#goldGrad)" stroke="#B71C1C" stroke-width="1"/>
  <!-- Gear wheel (Roda Gigi) -->
  <circle cx="100" cy="188" r="42" fill="none" stroke="#212121" stroke-width="8" stroke-dasharray="8 6"/>
  <circle cx="100" cy="188" r="38" fill="#43A047" stroke="#1B5E20" stroke-width="2"/>
  <!-- Waves (Gelombang Laut) -->
  <path d="M 35,182 Q 55,174 75,182 T 115,182 T 155,182 T 165,182 L 165,198 C 145,215 125,225 100,230 C 75,225 55,215 35,198 Z" fill="#0288D1"/>
  <path d="M 40,186 Q 60,180 80,186 T 120,186 T 160,186" fill="none" stroke="#E1F5FE" stroke-width="2"/>
  <!-- Cotton (Kapas) on Left -->
  <g fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5">
    <circle cx="48" cy="85" r="7"/>
    <circle cx="43" cy="100" r="7"/>
    <circle cx="40" cy="116" r="7"/>
    <circle cx="39" cy="133" r="7"/>
    <circle cx="42" cy="150" r="7"/>
    <circle cx="48" cy="165" r="7"/>
  </g>
  <!-- Rice (Padi) on Right -->
  <g fill="#FFD54F" stroke="#E65100" stroke-width="1.2">
    <ellipse cx="152" cy="80" rx="6" ry="4" transform="rotate(-30 152 80)"/>
    <ellipse cx="157" cy="95" rx="6" ry="4" transform="rotate(-25 157 95)"/>
    <ellipse cx="160" cy="110" rx="6" ry="4" transform="rotate(-20 160 110)"/>
    <ellipse cx="161" cy="126" rx="6" ry="4" transform="rotate(-15 161 126)"/>
    <ellipse cx="158" cy="142" rx="6" ry="4" transform="rotate(-10 158 142)"/>
    <ellipse cx="152" cy="158" rx="6" ry="4" transform="rotate(-5 152 158)"/>
  </g>
  <!-- Banner: JAWA TIMUR -->
  <path d="M 60,195 Q 100,185 140,195 L 142,208 Q 100,198 58,208 Z" fill="#FFFFFF" stroke="#212121" stroke-width="1.5"/>
  <text x="100" y="204" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" text-anchor="middle" fill="#000000" letter-spacing="1">JAWA TIMUR</text>
  <!-- Lower Ribbon: JER BASUKI MAWA BEYA -->
  <path d="M 22,228 Q 100,248 178,228 L 180,242 Q 100,264 20,242 Z" fill="#FFFFFF" stroke="#212121" stroke-width="1.5"/>
  <text x="100" y="241" font-family="'Arial Black', sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#000000" letter-spacing="0.5">JER BASUKI MAWA BEYA</text>
</svg>
